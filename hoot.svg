<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="Hoot the owl tutor">
<defs>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a5a"/><stop offset="1" stop-color="#8a5a32"/></linearGradient>
<linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9c2"/><stop offset="1" stop-color="#f3c987"/></linearGradient>
<radialGradient id="eye"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f4f1ff"/></radialGradient>
</defs>
<!-- feet -->
<g fill="#ffb02e"><ellipse cx="78" cy="206" rx="20" ry="8"/><ellipse cx="122" cy="206" rx="20" ry="8"/></g>

<ellipse cx="100" cy="132" rx="64" ry="72" fill="url(#body)"/>
<ellipse cx="100" cy="150" rx="40" ry="52" fill="url(#belly)"/>
<g fill="none" stroke="#e0a965" stroke-width="3" stroke-linecap="round" opacity=".9">
<path d="M82 132 q6 6 12 0"/><path d="M96 132 q6 6 12 0"/><path d="M110 132 q6 6 12 0"/>
<path d="M76 152 q6 6 12 0"/><path d="M90 152 q6 6 12 0"/><path d="M104 152 q6 6 12 0"/><path d="M118 152 q6 6 12 0"/>
<path d="M86 172 q6 6 12 0"/><path d="M100 172 q6 6 12 0"/>
</g>
<!-- ear tufts -->
<path d="M44 46 L58 78 L78 56Z" fill="#8a5a32"/><path d="M156 46 L142 78 L122 56Z" fill="#8a5a32"/>
